# Portable terminal defaults; local overrides may remain in ~/.tmux.conf.
# Programs inside tmux should see tmux's terminfo, while tmux itself needs the
# capabilities of the client terminal (Kitty when connecting from this Mac).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set -as terminal-features ",xterm-kitty:256,RGB,clipboard,ccolour,cstyle,extkeys,focus,hyperlinks,mouse,osc7,strikethrough,sync,title,usstyle"
set -g extended-keys on
# Required for Kitty graphics/file-transfer protocols such as remote kitten dnd.
set -g allow-passthrough on

set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g escape-time 10
set -g focus-events on

setw -g automatic-rename on
set -g set-titles on
# pane_title carries remote Pi mode markers (terminal:pi-normal/insert) to Kitty.
set -g set-titles-string "tmux:#S · #I:#W · #{pane_title} · #{pane_current_command}"
setw -g aggressive-resize on

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind D kill-pane
# Open URLs from the pane, re-joining wrapped lines that Kitty cannot detect.
bind u run-shell -b "\${XDG_CONFIG_HOME:-\$HOME/.config}/nvim/bin/tmux-url-open '#{pane_id}'"
