# Portable terminal defaults; local overrides may remain in ~/.tmux.conf.
# Programs inside tmux should see tmux's terminfo, while tmux itself needs the
# capabilities of the client terminal (Kitty when connecting from this Mac).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set -as terminal-features ",xterm-kitty:256,RGB,clipboard,ccolour,cstyle,extkeys,focus,hyperlinks,mouse,osc7,strikethrough,sync,title,usstyle"
set -g extended-keys on

# Keep tmux's cell-width calculation aligned with Kitty/Maple Mono NF.
# Emoji occupy two cells; Nerd Font private-use glyphs occupy one.
set -g codepoint-widths[0] "U+1F4BB=2" # 💻 prompt
set -g codepoint-widths[1] "U+1F310=2" # 🌐 hostname
set -g codepoint-widths[2] "U+274C=2"  # ❌ error prompt
set -g codepoint-widths[3] "U+E000-U+F8FF=1"
set -g codepoint-widths[4] "U+F0000-U+FFFFD=1"
set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g escape-time 10
set -g focus-events on

setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "tmux:#S · #I:#W · #{pane_current_command}"
setw -g aggressive-resize on

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind D kill-pane
